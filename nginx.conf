server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular ทำ routing ฝั่ง client: /admin/dashboard ไม่มีไฟล์จริงบนดิสก์
    # ถ้าไม่มีบรรทัดนี้ การรีเฟรชหน้าที่ไม่ใช่หน้าแรกจะได้ 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ห้าม cache ไม่งั้นผู้ใช้ค้างอยู่กับ bundle เก่าหลัง deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
